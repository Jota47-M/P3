<svg viewBox="0 0 380 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial">
                            <defs>
                                <marker id="c1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
                                    <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
                                </marker>
                            </defs>
                            <!-- Inicio -->
                            <rect x="140" y="10" width="90" height="32" rx="16" fill="#eaf6ff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="185" y="31" text-anchor="middle" font-size="15">Inicio</text>
                            <line x1="185" y1="42" x2="185" y2="58" stroke="#2c3e50" stroke-width="2" marker-end="url(#c1)"/>
                            <!-- Entrada -->
                            <polygon points="140,60 240,60 225,90 125,90" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="182" y="80" text-anchor="middle" font-size="14">Lea x</text>
                            <line x1="182" y1="90" x2="182" y2="106" stroke="#2c3e50" stroke-width="2" marker-end="url(#c1)"/>
                            <!-- Proceso residuo -->
                            <rect x="105" y="108" width="160" height="32" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="185" y="129" text-anchor="middle" font-size="13">residuo = x mod 2</text>
                            <line x1="185" y1="140" x2="185" y2="158" stroke="#2c3e50" stroke-width="2" marker-end="url(#c1)"/>
                            <!-- Decisión -->
                            <polygon points="185,160 290,205 185,250 80,205" fill="#fff7e6" stroke="#2c3e50" stroke-width="2"/>
                            <text x="185" y="201" text-anchor="middle" font-size="12">¿residuo</text>
                            <text x="185" y="216" text-anchor="middle" font-size="12">= 0?</text>
                            <!-- Camino Sí (abajo) -->
                            <line x1="185" y1="250" x2="185" y2="300" stroke="#2c3e50" stroke-width="2" marker-end="url(#c1)"/>
                            <text x="197" y="272" font-size="12" fill="#27ae60">Sí</text>
                            <polygon points="105,302 265,302 250,338 90,338" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="178" y="324" text-anchor="middle" font-size="12">"El número es par"</text>
                            <!-- Camino No (derecha) -->
                            <line x1="290" y1="205" x2="335" y2="205" stroke="#2c3e50" stroke-width="2"/>
                            <text x="298" y="198" font-size="12" fill="#e74c3c">No</text>
                            <line x1="335" y1="205" x2="335" y2="320" stroke="#2c3e50" stroke-width="2"/>
                            <line x1="335" y1="320" x2="335" y2="338" stroke="#2c3e50" stroke-width="2"/>
                            <polygon points="280,340 380,340 365,376 265,376" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="322" y="362" text-anchor="middle" font-size="11">"El número es impar"</text>
                            <!-- Convergencia hacia Fin -->
                            <line x1="178" y1="338" x2="178" y2="400" stroke="#2c3e50" stroke-width="2"/>
                            <line x1="322" y1="376" x2="322" y2="392" stroke="#2c3e50" stroke-width="2"/>
                            <line x1="322" y1="392" x2="185" y2="392" stroke="#2c3e50" stroke-width="2"/>
                            <line x1="185" y1="392" x2="185" y2="408" stroke="#2c3e50" stroke-width="2" marker-end="url(#c1)"/>
                            <!-- Fin -->
                            <rect x="140" y="410" width="90" height="32" rx="16" fill="#eaf6ff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="185" y="431" text-anchor="middle" font-size="15">Fin</text>
                        </svg>
