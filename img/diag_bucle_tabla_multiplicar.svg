<svg viewBox="0 0 400 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial">
                            <defs>
                                <marker id="b1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
                                    <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
                                </marker>
                            </defs>
                            <!-- Inicio -->
                            <rect x="150" y="8" width="90" height="30" rx="15" fill="#eaf6ff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="195" y="28" text-anchor="middle" font-size="14">Inicio</text>
                            <line x1="195" y1="38" x2="195" y2="52" stroke="#2c3e50" stroke-width="2" marker-end="url(#b1)"/>
                            <!-- Entrada -->
                            <polygon points="150,54 250,54 235,82 135,82" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="192" y="73" text-anchor="middle" font-size="13">Leer numero</text>
                            <line x1="192" y1="82" x2="192" y2="98" stroke="#2c3e50" stroke-width="2" marker-end="url(#b1)"/>
                            <!-- contador = 1 -->
                            <rect x="120" y="100" width="150" height="30" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="195" y="120" text-anchor="middle" font-size="13">contador = 1</text>
                            <line x1="195" y1="130" x2="195" y2="148" stroke="#2c3e50" stroke-width="2" marker-end="url(#b1)"/>
                            <!-- Decisión Mientras -->
                            <polygon points="195,150 300,195 195,240 90,195" fill="#fff7e6" stroke="#2c3e50" stroke-width="2"/>
                            <text x="195" y="191" text-anchor="middle" font-size="12">¿contador</text>
                            <text x="195" y="206" text-anchor="middle" font-size="12">&lt;= 10?</text>
                            <!-- Sí: cuerpo del bucle -->
                            <line x1="195" y1="240" x2="195" y2="258" stroke="#2c3e50" stroke-width="2" marker-end="url(#b1)"/>
                            <text x="207" y="254" font-size="12" fill="#27ae60">Sí</text>
                            <rect x="100" y="260" width="190" height="32" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="195" y="281" text-anchor="middle" font-size="12">resultado = numero * contador</text>
                            <line x1="195" y1="292" x2="195" y2="308" stroke="#2c3e50" stroke-width="2" marker-end="url(#b1)"/>
                            <polygon points="95,310 295,310 280,356 110,356" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="195" y="330" text-anchor="middle" font-size="11">Imprimir numero, "x",</text>
                            <text x="195" y="346" text-anchor="middle" font-size="11">contador, "=", resultado</text>
                            <line x1="195" y1="356" x2="195" y2="372" stroke="#2c3e50" stroke-width="2" marker-end="url(#b1)"/>
                            <rect x="105" y="374" width="180" height="32" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="195" y="395" text-anchor="middle" font-size="12">contador = contador + 1</text>
                            <!-- Retorno al while (flecha de bucle por la izquierda) -->
                            <line x1="105" y1="390" x2="40" y2="390" stroke="#2c3e50" stroke-width="2"/>
                            <line x1="40" y1="390" x2="40" y2="195" stroke="#2c3e50" stroke-width="2"/>
                            <line x1="40" y1="195" x2="88" y2="195" stroke="#2c3e50" stroke-width="2" marker-end="url(#b1)"/>
                            <text x="48" y="290" font-size="11" fill="#3498db">repetir</text>
                            <!-- No: salir del bucle hacia Fin -->
                            <line x1="300" y1="195" x2="350" y2="195" stroke="#2c3e50" stroke-width="2"/>
                            <text x="308" y="188" font-size="12" fill="#e74c3c">No</text>
                            <line x1="350" y1="195" x2="350" y2="470" stroke="#2c3e50" stroke-width="2"/>
                            <line x1="350" y1="470" x2="195" y2="470" stroke="#2c3e50" stroke-width="2"/>
                            <line x1="195" y1="470" x2="195" y2="488" stroke="#2c3e50" stroke-width="2" marker-end="url(#b1)"/>
                            <!-- Fin -->
                            <rect x="150" y="490" width="90" height="30" rx="15" fill="#eaf6ff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="195" y="510" text-anchor="middle" font-size="14">Fin</text>
                        </svg>
