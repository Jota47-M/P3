<svg viewBox="0 0 300 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial">
                            <defs>
                                <marker id="ar1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
                                    <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
                                </marker>
                            </defs>
                            <!-- Inicio -->
                            <rect x="105" y="10" width="90" height="34" rx="17" fill="#eaf6ff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="150" y="32" text-anchor="middle" font-size="15">Inicio</text>
                            <line x1="150" y1="44" x2="150" y2="64" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar1)"/>
                            <!-- Entrada -->
                            <polygon points="80,68 230,68 210,100 60,100" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="145" y="89" text-anchor="middle" font-size="14">Lea n1, n2</text>
                            <line x1="145" y1="100" x2="145" y2="118" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar1)"/>
                            <!-- Procesos -->
                            <rect x="55" y="120" width="190" height="34" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="150" y="142" text-anchor="middle" font-size="13">Suma = n1 + n2</text>
                            <line x1="150" y1="154" x2="150" y2="170" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar1)"/>
                            <rect x="55" y="172" width="190" height="34" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="150" y="194" text-anchor="middle" font-size="13">Resta = n1 - n2</text>
                            <line x1="150" y1="206" x2="150" y2="222" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar1)"/>
                            <rect x="55" y="224" width="190" height="34" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="150" y="246" text-anchor="middle" font-size="13">Multiplicacion = n1 * n2</text>
                            <line x1="150" y1="258" x2="150" y2="274" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar1)"/>
                            <rect x="55" y="276" width="190" height="34" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="150" y="298" text-anchor="middle" font-size="13">Division = n1 / n2</text>
                            <line x1="150" y1="310" x2="150" y2="326" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar1)"/>
                            <!-- Salida -->
                            <polygon points="60,328 240,328 220,392 40,392" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="140" y="352" text-anchor="middle" font-size="12">Imprimir Suma, Resta,</text>
                            <text x="140" y="370" text-anchor="middle" font-size="12">Multiplicacion, Division</text>
                            <line x1="140" y1="392" x2="140" y2="412" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar1)"/>
                            <!-- Fin -->
                            <rect x="95" y="414" width="90" height="34" rx="17" fill="#eaf6ff" stroke="#2c3e50" stroke-width="2"/>
                            <text x="140" y="436" text-anchor="middle" font-size="15">Fin</text>
                        </svg>
